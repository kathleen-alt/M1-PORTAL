const compact=n=>new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD",notation:"compact",maximumFractionDigits:0}).format(n);
const band=n=>n<75000?"Under $75K":n<150000?"$75K–$150K":n<300000?"$150K–$300K":n<500000?"$300K–$500K":"$500K+";
const esc=s=>(s==null?"":String(s)).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const col=s=>s>=80?"var(--good)":s>=60?"var(--cold)":s>=40?"var(--warm)":"var(--hot)";
const badge=c=>c==="Hot"?"b-hot":c==="Warm"?"b-warm":"b-cold";
const maps=o=>(o.lat!=null&&o.lng!=null)?("https://www.google.com/maps/search/?api=1&query="+o.lat+","+o.lng):("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([o.name,o.city,o.region,o.country].filter(Boolean).join(", ")));
const nurl=u=>u?(/^https?:\/\//i.test(u)?u:"https://"+u.replace(/^\/+/,"")):"";
function ring(s){return '<div class="ring" style="background:conic-gradient('+col(s)+' '+(s*3.6)+'deg,#143a54 0deg)"><div class="in">'+s+'</div></div>';}
function bar(label,s){return '<div class="bar"><div class="t"><span>'+label+'</span><span style="color:'+col(s)+'">'+s+'</span></div><div class="track"><div class="fill" style="width:'+s+'%;background:'+col(s)+'"></div></div></div>';}
function fld(lbl,v){return '<div><div class="lbl">'+lbl+'</div><div class="v">'+(v!=null&&v!==""?v:'<span style="color:var(--muted)">—</span>')+'</div></div>';}
function fmtD(iso){return new Date(iso).toLocaleDateString("en-CA",{month:"short",day:"numeric"});}

const clampS=n=>Math.max(0,Math.min(100,n));
const TBF={1:80,2:68,3:60,4:58,5:48,6:40};
function fitScore(ind,s){const m=IM[ind];let sc=TBF[m.tier]||40;sc+=(s.childFocused!=null?s.childFocused:m.childFocused)?8:-6;if(s.facilitySqFt){if(s.facilitySqFt>=40000)sc+=8;else if(s.facilitySqFt>=15000)sc+=4;else if(s.facilitySqFt<5000)sc-=6;}if(s.locationCount&&s.locationCount>1)sc+=Math.min(8,s.locationCount*2);if(s.hasExistingPlayArea)sc-=4;return Math.round(clampS(sc));}
function budgetScore(s){let sc=50;switch(s.annualBudgetBand){case"over_10m":sc=92;break;case"2m_10m":sc=80;break;case"500k_2m":sc=62;break;case"under_500k":sc=38;break;default:if(s.orgSize){if(s.orgSize>=200)sc=78;else if(s.orgSize>=50)sc=64;else if(s.orgSize>=15)sc=52;else sc=42;}}if(s.growthIndicators&&s.growthIndicators.length)sc+=Math.min(12,s.growthIndicators.length*5);return Math.round(clampS(sc));}
function trafficScore(ind,s){const m=IM[ind];let sc=(s.childFocused!=null?s.childFocused:m.childFocused)?60:35;if(s.weeklyFamilyTraffic){if(s.weeklyFamilyTraffic>=3000)sc=95;else if(s.weeklyFamilyTraffic>=1000)sc=82;else if(s.weeklyFamilyTraffic>=300)sc=68;else sc=50;}if(s.locationCount&&s.locationCount>1)sc+=5;return Math.round(clampS(sc));}
function dmScore(cts){const dm=cts.filter(c=>c.isDecisionMaker);if(dm.length===0)return cts.length===0?15:35;const per=dm.map(c=>{let v=c.confidence*0.5;if(c.email)v+=25;if(c.phone)v+=15;if(c.linkedin)v+=10;return clampS(v);});return Math.round(clampS(per.reduce((a,b)=>a+b,0)/per.length+Math.min(10,(dm.length-1)*5)));}
function estVal(ind,s){const m=IM[ind];let mult=1;if(s.facilitySqFt){if(s.facilitySqFt>=40000)mult*=1.3;else if(s.facilitySqFt>=15000)mult*=1.1;else if(s.facilitySqFt<5000)mult*=0.8;}if(s.locationCount&&s.locationCount>1)mult*=1+Math.min(1,(s.locationCount-1)*0.15);const r=n=>Math.round(n*mult/1000)*1000;return{low:r(m.baseLow),high:r(m.baseHigh)};}
function revScore(ind,s){return Math.round(clampS(40+((estVal(ind,s).high-50000)/650000)*58));}
function scoreOf(l){const pf=fitScore(l.industry,l.signals),bl=budgetScore(l.signals),ft=trafficScore(l.industry,l.signals),dm=dmScore(l.contacts),rp=revScore(l.industry,l.signals);return{playgroundFit:pf,budgetLikelihood:bl,familyTraffic:ft,decisionMakerAccess:dm,revenuePotential:rp,opportunity:Math.round(pf*0.3+bl*0.2+ft*0.2+dm*0.15+rp*0.15),tier:IM[l.industry].tier};}
function qualify(l){const s=l.signals;let sc=30;if(s.orgSize)sc+=s.orgSize>=100?12:s.orgSize>=30?8:4;if(s.facilitySqFt)sc+=s.facilitySqFt>=20000?12:s.facilitySqFt>=8000?7:3;if(s.locationCount&&s.locationCount>1)sc+=Math.min(10,s.locationCount*3);if(s.childFocused!=null?s.childFocused:IM[l.industry].childFocused)sc+=12;if(s.hasExistingPlayArea)sc+=6;sc+=budgetScore(s)*0.15;if(s.growthIndicators&&s.growthIndicators.length)sc+=Math.min(12,s.growthIndicators.length*4);sc=Math.round(clampS(sc));return{score:sc,category:sc>=75?"Hot":sc>=50?"Warm":"Cold"};}
function closeProb(sc){const tf={1:1,2:.9,3:.82,4:.8,5:.7,6:.62}[sc.tier]||.6;return Math.round(clampS((sc.opportunity*.6+sc.decisionMakerAccess*.4)*tf));}
const TBL={1:{orgSize:80,facilitySqFt:30000,annualBudgetBand:"2m_10m",weeklyFamilyTraffic:2000},2:{orgSize:25,facilitySqFt:7000,annualBudgetBand:"500k_2m",weeklyFamilyTraffic:500},3:{orgSize:45,facilitySqFt:25000,annualBudgetBand:"2m_10m",weeklyFamilyTraffic:1500},4:{orgSize:50,facilitySqFt:35000,annualBudgetBand:"2m_10m",weeklyFamilyTraffic:3000},5:{orgSize:120,facilitySqFt:20000,annualBudgetBand:"2m_10m",weeklyFamilyTraffic:800},6:{orgSize:40,facilitySqFt:15000,annualBudgetBand:"500k_2m",weeklyFamilyTraffic:700}};
function enrichSignals(l){const m=IM[l.industry];const b=TBL[m.tier]||TBL[6];const s=l.signals;const notes=[];const lo=l.name.toLowerCase();if(s.childFocused==null){s.childFocused=m.childFocused;notes.push("child-focused: "+(m.childFocused?"yes":"no"));}if(s.facilitySqFt==null){let q=b.facilitySqFt;if(/(flagship|regional|metro|greater|district|county|central)/.test(lo))q=Math.round(q*1.3);s.facilitySqFt=q;notes.push("facility ~"+q.toLocaleString()+" sqft");}if(s.orgSize==null){s.orgSize=b.orgSize;notes.push("org size ~"+b.orgSize);}if(s.annualBudgetBand==null){s.annualBudgetBand=b.annualBudgetBand;notes.push("budget "+b.annualBudgetBand);}if(s.weeklyFamilyTraffic==null){s.weeklyFamilyTraffic=b.weeklyFamilyTraffic;notes.push("traffic ~"+b.weeklyFamilyTraffic.toLocaleString());}if(s.locationCount==null&&/(multi-?campus|multi campus|locations|chain)/.test(lo)){s.locationCount=3;notes.push("multi-location x3");}return notes;}
function dom2(w){if(!w)return null;let d=w.toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").split(/[\/?#]/)[0];return d.indexOf(".")>=0?d:null;}
function firstName(f){return f.replace(/^(Dr\.|Pastor|Mr\.|Ms\.|Mrs\.|Rev\.)\s+/i,"").split(" ")[0];}
function guess(name,d){const c=name.replace(/^(dr\.?|pastor|mr\.?|ms\.?|mrs\.?|rev\.?)\s+/i,"").trim().split(/\s+/);const f=(c[0]||"").toLowerCase().replace(/[^a-z]/g,"");const l=(c.length>1?c[c.length-1]:"").toLowerCase().replace(/[^a-z]/g,"");if(!f)return null;return l?f+"."+l+"@"+d:f+"@"+d;}
function findEmails(lead){const d=dom2(lead.website);if(!d)return 0;let n=0;lead.contacts.forEach(c=>{if(!c.email){const g=guess(c.name,d);if(g){c.email=g;c.confidence=Math.round((c.confidence+55)/2);n++;}}});if(lead.contacts.length===0){lead.contacts.push({id:"role_i",name:"General Inbox",role:"Other",email:"info@"+d,confidence:45,isDecisionMaker:false});lead.contacts.push({id:"role_o",name:"Office",role:"Other",email:"office@"+d,confidence:40,isDecisionMaker:false});n+=2;}return n;}
function emailFor(lead,type,sim){const dm=lead.contacts.find(c=>c.isDecisionMaker)||lead.contacts[0];const isRole=dm?/inbox|^office$|general/i.test(dm.name):false;const greet=(dm&&!isRole)?("Hi "+firstName(dm.name)+","):"Hello,";const lab=IM[lead.industry].label.split(" ").map(w=>/^[A-Z]{2,4}$/.test(w)?w:w.toLowerCase()).join(" ");const ref=sim||"comparable organizations across Canada and the U.S.";const city=lead.address.city;const cta="Would you be open to a quick 15-minute call next week?";if(type==="first_touch")return{subject:"A play space families at "+lead.name+" would love",body:greet+"\n\nI lead business development at Orca Coast Playgrounds — we design and install indoor playgrounds for "+lab+"s like "+lead.name+". We recently completed a project for "+ref+", and the response from families has been remarkable.\n\nGiven everything happening at "+lead.name+" in "+city+", I think there's a real opportunity to create a destination play experience.\n\n"+cta};if(type==="follow_up")return{subject:"Following up — indoor play at "+lead.name,body:greet+"\n\nCircling back on my note about an indoor playground for "+lead.name+". Organizations we work with typically see higher family visit frequency within the first season.\n\n"+cta};if(type==="case_study")return{subject:"Case study: "+(sim||"a project like yours"),body:greet+"\n\nThought "+(sim||"this")+" might resonate — a similar installation became a centrepiece for the families they serve. I'd love to share the full case study for "+lead.name+".\n\n"+cta};if(type==="final_check_in")return{subject:"Should I close the loop?",body:greet+"\n\nI haven't heard back, so I'll assume the timing isn't right for an indoor playground at "+lead.name+" just yet. I'll leave the door open."};return{subject:"How play space drives family engagement",body:greet+"\n\nA quick insight: a well-designed indoor playground is one of the highest-ROI family amenities you can add — more dwell time, repeat visits, word-of-mouth."};}

// ---------- lookalike vs REAL portfolio ----------
function shortName(n){return n.split(/[:–]/)[0].trim();}
function lookalikes(lead){const lt=IM[lead.industry].tier;const lc=lead.signals.childFocused!=null?lead.signals.childFocused:IM[lead.industry].childFocused;return DATA.portfolio.map(p=>{let s=0;const reasons=[];if(p.ind===lead.industry){s+=55;reasons.push("Same category as "+shortName(p.name));}else if(p.tier===lt){s+=33;reasons.push("Same tier as "+shortName(p.name));}else{s+=Math.max(0,18-Math.abs(p.tier-lt)*5);}s+=8;if(p.country===lead.address.country){s+=7;if(p.region===lead.address.region){s+=8;reasons.push("Same region ("+p.region+")");}else{reasons.push("Same country");}}if(lc&&p.child)s+=10;return{name:shortName(p.name),similarity:Math.round(Math.max(0,Math.min(100,s))),reasons:reasons};}).sort((a,b)=>b.similarity-a.similarity).slice(0,3);}
function reasonsFor(lead,sc,top){const r=[];r.push(IM[lead.industry].label+" — Tier "+sc.tier+" prospect.");if(top)r.push("Similar to "+top.name+" — a comparable Orca Coast project.");if(sc.budgetLikelihood>=70)r.push("Strong budget likelihood.");if(sc.familyTraffic>=75)r.push("High family foot traffic.");if(sc.decisionMakerAccess>=70)r.push("Decision makers are reachable.");if(sc.tier===6)r.push("Hidden opportunity — serves families but likely lacks a playground.");return r;}

// ---------- CSV export ----------
function csvEsc(v){const s=v==null?"":String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function leadsCsv(leads){const H=["Organization","Contact","Role","Email","Phone","LinkedIn","Decision Maker","Industry","City","Region","Country","Website","Opportunity","Stage"];const rows=[H.join(",")];leads.forEach(l=>{const opp=scoreOf(l).opportunity;const ind=IM[l.industry].label;if(l.contacts.length===0){rows.push([l.name,"","","",l.phone||"","","",ind,l.address.city||"",l.address.region,l.address.country,l.website||"",opp,l.stage].map(csvEsc).join(","));}else{l.contacts.forEach(c=>{rows.push([l.name,c.name,c.role,c.email||"",c.phone||l.phone||"",c.linkedin||"",c.isDecisionMaker?"yes":"no",ind,l.address.city||"",l.address.region,l.address.country,l.website||"",opp,l.stage].map(csvEsc).join(","));});}});return rows.join("\n");}
function downloadCsv(name,text){const blob=new Blob([text],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportAllContacts(){const ls=STATE.starredOnly?STATE.leads.filter(l=>l.starred):STATE.leads;if(!ls.length){alert("No leads to export yet — add some in the Add / Source Leads tab.");return;}downloadCsv(STATE.starredOnly?"orca-contacts-starred.csv":"orca-contacts.csv",leadsCsv(ls));}

// ---------- import ----------
function addImported(text,defRegion){const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const def=(defRegion||"").toUpperCase();let added=0;lines.forEach((line,i)=>{const parts=splitLine(line).map(s=>s.trim());const name=parts[0];if(!name||/^name$/i.test(name))return;let region=null,country=null;const fr=findRegion(line);if(parts[2]&&(CA.indexOf(parts[2].toUpperCase())>=0||US.indexOf(parts[2].toUpperCase())>=0)){region=parts[2].toUpperCase();country=CA.indexOf(region)>=0?"CA":"US";}else if(fr){region=fr.region;country=fr.country;}else if(def){region=def;country=CA.indexOf(def)>=0?"CA":(US.indexOf(def)>=0?"US":null);}if(!region||!country)return;let city=parts[1]&&!(CA.indexOf(parts[1].toUpperCase())>=0||US.indexOf(parts[1].toUpperCase())>=0)&&!/\d/.test(parts[1])&&!/\.[a-z]{2,}/i.test(parts[1])?parts[1]:"";const website=parts.find(p=>/\.[a-z]{2,}/i.test(p)&&/(www|\.com|\.ca|\.org|\.net|http)/i.test(p));const ind=classify(name,parts[2]);const key=(name.toLowerCase()+"|"+city.toLowerCase()+"|"+region);if(STATE.leads.some(l=>(l.name.toLowerCase()+"|"+(l.address.city||"").toLowerCase()+"|"+l.address.region)===key))return;STATE.leads.push({id:"imp_"+Date.now()+"_"+i,name:name,industry:ind,website:website||undefined,address:{city:city,region:region,country:country},contacts:[],signals:{},dataConfidence:55,source:"directory",stage:"New Lead"});added++;});save();return added;}

// ---------- actions ----------
function openLead(id){STATE.sel=id;show("leads");window.scrollTo(0,0);}
function backLeads(){STATE.sel=null;show("leads");}
function toggleStar(id){const l=leadById(id);if(l)l.starred=!l.starred;save();show("leads");}
function toggleStarredFilter(){STATE.starredOnly=!STATE.starredOnly;show("leads");}
function starIcon(on){return '<span style="cursor:pointer;font-size:16px;color:'+(on?"#fbbf24":"#1c5375")+'">'+(on?"★":"☆")+'</span>';}
function doEnrich(id){const l=leadById(id);const before=scoreOf(l).opportunity;const notes=enrichSignals(l);const em=findEmails(l);l.dataConfidence=Math.min(95,l.dataConfidence+12);STATE.report[id]={notes:notes,emails:em,before:before,after:scoreOf(l).opportunity};save();show("leads");}
function doPush(id,campId){const l=leadById(id);const camp=DATA.campaigns.find(c=>c.id===campId)||DATA.campaigns[3];const start=Date.now();const ll=lookalikes(l);const sim=ll[0]?ll[0].name:null;const toC=l.contacts.find(c=>c.isDecisionMaker&&c.email)||l.contacts.find(c=>c.email);const toEmail=toC?toC.email:null;const steps=camp.cadence.map(st=>{let em=null;if(st.channel==="email"&&st.emailType)em=emailFor(l,st.emailType,sim);return{day:st.day,channel:st.channel,label:st.label,dueAt:new Date(start+st.day*86400000).toISOString(),subject:em?em.subject:null,body:em?em.body:null,status:"pending",toEmail:st.channel==="email"?toEmail:null};});STATE.enroll[id]={campaignName:camp.name,status:"active",steps:steps,idx:0};if(l.stage==="New Lead")l.stage="Contacted";save();show("leads");}
function markStep(id){const e=STATE.enroll[id];if(!e)return;const st=e.steps[e.idx];if(st)st.status="sent";e.idx++;if(e.idx>=e.steps.length)e.status="completed";save();show("leads");}
function markReplied(id){const e=STATE.enroll[id];if(e&&e.status==="active")e.status="paused";const l=leadById(id);if(l.stage==="New Lead"||l.stage==="Contacted")l.stage="Responded";save();show("leads");}

function leadDetail(id){const l=leadById(id);if(!l)return '<div class="card">Not found</div>';const sc=scoreOf(l),q=qualify(l),ev=estVal(l.industry,l.signals),cp=closeProb(sc),rep=STATE.report[id],e=STATE.enroll[id],ll=lookalikes(l);
  let h='<button class="btn-ghost" onclick="backLeads()">← All leads</button>';
  h+='<div class="row" style="margin-top:12px"><div><h1 style="margin:0"><span onclick="toggleStar(\''+id+'\')">'+starIcon(l.starred)+'</span> '+esc(l.name)+'</h1><div class="tag">'+esc(IM[l.industry].label)+' · '+esc(l.address.city)+', '+esc(l.address.region)+' · Tier '+sc.tier+' · '+esc(l.stage)+'</div><div style="margin-top:4px;font-size:12px"><a target="_blank" href="'+maps({name:l.name,city:l.address.city,region:l.address.region,country:l.address.country})+'" style="color:var(--muted)">📍 Map</a>'+(l.website?(' &nbsp; <a target="_blank" href="'+esc(nurl(l.website))+'" style="color:var(--muted)">🔗 Website</a>'):"")+'</div></div>'+ring(sc.opportunity)+'</div>';
  h+='<div class="card" style="margin-top:14px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btnG" onclick="doEnrich(\''+id+'\')">✨ Enrich data</button>'+(!e?('<select id="campSel">'+DATA.campaigns.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select><button class="btnG" onclick="doPush(\''+id+'\',document.getElementById(\'campSel\').value)">▶ Push to sequence</button>'):('<span class="tag">In sequence: '+esc(e.campaignName)+'</span>'))+'</div>'+(rep?('<div class="note" style="margin-top:10px;color:var(--good)">Enriched: +'+rep.emails+' email(s) · Opportunity '+rep.before+' → '+rep.after+(rep.notes.length?(' · '+esc(rep.notes.join(" · "))):"")+'</div>'):"")+'</div>';
  h+='<div class="card" style="margin-top:14px"><b>Opportunity Scores</b><div class="bars" style="margin-top:10px">'+bar("Playground Fit",sc.playgroundFit)+bar("Budget Likelihood",sc.budgetLikelihood)+bar("Family Traffic",sc.familyTraffic)+bar("Decision-Maker Access",sc.decisionMakerAccess)+bar("Revenue Potential",sc.revenuePotential)+bar("Lead Qualification",q.score)+'</div><div class="kv" style="margin-top:12px"><div><div class="lbl">Est. Value (ind.)</div><div class="v">'+money(ev.low)+'–'+money(ev.high)+'</div></div><div><div class="lbl">Close Prob.</div><div class="v" style="color:'+col(cp)+'">'+cp+'%</div></div><div><div class="lbl">Confidence</div><div class="v">'+l.dataConfidence+'</div></div></div></div>';
  if(e)h+=seqHtml(id,e);
  h+='<div class="card" style="margin-top:14px"><b>Firmographics</b><div class="kv" style="margin-top:10px">'+fld("Org Size",l.signals.orgSize?("~"+l.signals.orgSize):null)+fld("Facility",l.signals.facilitySqFt?("~"+l.signals.facilitySqFt.toLocaleString()+" sqft"):null)+fld("Locations",l.signals.locationCount||null)+fld("Child-Focused",l.signals.childFocused==null?null:(l.signals.childFocused?"Yes":"No"))+fld("Budget",l.signals.annualBudgetBand||null)+fld("Traffic",l.signals.weeklyFamilyTraffic?("~"+l.signals.weeklyFamilyTraffic.toLocaleString()):null)+'</div><div class="note" style="margin-top:8px">'+(l.signals.orgSize?"Estimated by category — confirm with enrichment / your own research.":"Empty until you Enrich.")+'</div></div>';
  h+='<div class="card" style="margin-top:14px"><div class="row"><b>Contacts</b><button class="btn-ghost" onclick="exportLeadContacts(\''+id+'\')">⬇ CSV</button></div>'+(l.contacts.length?l.contacts.map(c=>'<div style="margin-top:8px"><b>'+esc(c.name)+'</b> <span class="tag">'+esc(c.role)+(c.isDecisionMaker?" · decision maker":"")+'</span>'+(c.email?('<div class="tag">'+esc(c.email)+'</div>'):"")+'</div>').join(""):'<div class="note">No contacts yet — click ✨ Enrich to add role inboxes (info@/office@).</div>')+'</div>';
  h+='<div class="card" style="margin-top:14px"><b>Similar Orca Coast Projects (real)</b>'+ll.map(m=>'<div style="margin-top:6px"><span class="hl">'+m.similarity+'%</span> '+esc(m.name)+'<div class="tag">'+esc(m.reasons.join(" · "))+'</div></div>').join("")+'</div>';
  return h;
}

function recCard(l,i){const sc=scoreOf(l),q=qualify(l),ev=estVal(l.industry,l.signals),cp=closeProb(sc),ll=lookalikes(l);const reasons=reasonsFor(l,sc,ll[0]);return '<div class="card"><div class="row"><div><div style="display:flex;gap:8px;align-items:center"><span class="muted" style="font-weight:700">#'+(i+1)+'</span><b style="color:#fff">'+esc(l.name)+'</b><span class="pill '+badge(q.category)+'">'+q.category+'</span></div><div class="tag" style="margin-top:2px">'+esc(IM[l.industry].label)+' · '+esc(l.address.city)+', '+esc(l.address.region)+' · Tier '+sc.tier+'</div></div>'+ring(sc.opportunity)+'</div><ul class="reasons">'+reasons.slice(0,4).map(r=>'<li>'+esc(r)+'</li>').join("")+'</ul><div class="bars">'+bar("Playground Fit",sc.playgroundFit)+bar("Budget",sc.budgetLikelihood)+bar("Family Traffic",sc.familyTraffic)+bar("DM Access",sc.decisionMakerAccess)+bar("Revenue",sc.revenuePotential)+bar("Qualification",q.score)+'</div><div class="kv"><div><div class="lbl">Est. Value (ind.)</div><div class="v">'+money(ev.low)+'–'+money(ev.high)+'</div></div><div><div class="lbl">Close Prob.</div><div class="v" style="color:'+col(cp)+'">'+cp+'%</div></div><div><div class="lbl">Top Match</div><div class="v">'+(ll[0]?esc(ll[0].name):"—")+'</div></div></div><div style="margin-top:10px"><button class="btn-ghost" onclick="openLead(\''+l.id+'\')">Open →</button></div></div>';}

function emptyLeads(msg){return '<div class="empty">'+msg+'<div style="margin-top:12px"><button class="btnG" onclick="show(\'source\')">Add leads</button></div></div>';}

function view_who(){if(STATE.leads.length===0)return '<h1>Who Should We Contact This Week?</h1><p class="sub">Ranks your leads by Opportunity Score against the real portfolio.</p>'+emptyLeads("No leads yet.");const recs=STATE.leads.filter(l=>l.stage!=="Closed Won"&&l.stage!=="Closed Lost").map(l=>({l:l,opp:scoreOf(l).opportunity})).sort((a,b)=>b.opp-a.opp);const above=recs.filter(r=>r.opp>=80).length;return '<h1>Who Should We Contact This Week?</h1><p class="sub">Your leads ranked by Opportunity Score, matched to similar real Orca Coast projects. Dollar figures are indicative ranges (custom-scoped).</p><div class="grid g4" style="margin-bottom:18px">'+stat("Leads",recs.length)+stat("Scoring 80+",above)+stat("Portfolio",DATA.portfolio.length)+stat("Top",recs[0]?recs[0].opp:"—")+'</div><div class="grid g2">'+recs.map((r,i)=>recCard(r.l,i)).join("")+'</div>';}
function stat(l,v){return '<div class="card stat"><div class="lbl">'+l+'</div><div class="val">'+v+'</div></div>';}

function view_pipeline(){const stages=["New Lead","Contacted","Responded","Discovery Call","Proposal Sent","Negotiation","Closed Won","Closed Lost"];if(STATE.leads.length===0)return '<h1>Pipeline</h1><p class="sub">Your leads across the eight stages. Stages advance as you work them (e.g. sending a sequence step → Contacted).</p>'+emptyLeads("No leads yet.");const by={};STATE.leads.forEach(l=>{(by[l.stage]=by[l.stage]||[]).push(l);});return '<h1>Pipeline</h1><p class="sub">Your leads across the eight stages — driven by your real activity, not fabricated.</p><div class="cols">'+stages.map(s=>{const cs=by[s]||[];const tot=cs.reduce((x,l)=>x+estVal(l.industry,l.signals).high,0);return '<div class="col"><h4>'+s+' <span class="pill b-cold">'+cs.length+'</span></h4><div class="tag" style="padding:0 10px 6px">'+compact(tot)+' potential</div><div class="body">'+cs.map(l=>{const sc=scoreOf(l);return '<div class="card" style="padding:9px;cursor:pointer" onclick="openLead(\''+l.id+'\')"><div style="font-weight:600;font-size:13px">'+esc(l.name)+'</div><div class="tag">'+esc(l.address.city)+', '+esc(l.address.region)+'</div><div style="text-align:right;color:'+col(sc.opportunity)+';font-weight:700;font-size:12px">'+sc.opportunity+'</div></div>';}).join("")+'</div></div>';}).join("")+'</div>';}

function view_campaigns(){const icon={email:"✉️",phone:"📞",linkedin:"in",sms:"💬"};let out='<h1>Outreach Campaigns &amp; Sequences</h1><p class="sub">Vertical templates with the Day 1→30 cadence. Push any lead into a sequence from its detail page; emails are pre-generated and dated.</p><div class="grid g2">'+DATA.campaigns.map(c=>'<div class="card"><div class="row"><b>'+esc(c.name)+'</b><span class="pill b-cold">'+esc(c.vertical)+'</span></div><div style="margin-top:6px">'+c.focusPoints.map(f=>'<span class="chip">'+esc(f)+'</span>').join("")+'</div><div class="lbl" style="margin-top:14px">Automated Cadence</div><div style="margin-top:8px">'+c.cadence.map(s=>'<div style="display:flex;gap:10px;align-items:center;margin:6px 0"><span class="chip" style="width:60px;justify-content:center">Day '+s.day+'</span><span>'+(icon[s.channel]||"")+' '+esc(s.label)+'</span></div>').join("")+'</div></div>').join("")+'</div>';const active=Object.keys(STATE.enroll);if(active.length){out+='<h2 style="margin:22px 0 10px">Active sequences ('+active.length+')</h2>'+active.map(id=>{const l=leadById(id);return l?('<div onclick="openLead(\''+id+'\')" style="cursor:pointer">'+seqHtml(id,STATE.enroll[id]).replace("<b>","<b>"+esc(l.name)+" — ")+'</div>'):"";}).join("");}return out;}

function view_market(){const byInd={};DATA.portfolio.forEach(p=>{byInd[p.ind]=byInd[p.ind]||{ind:p.ind,label:p.label,tier:p.tier,past:0,open:0};byInd[p.ind].past++;});STATE.leads.forEach(l=>{byInd[l.industry]=byInd[l.industry]||{ind:l.industry,label:IM[l.industry].label,tier:IM[l.industry].tier,past:0,open:0};byInd[l.industry].open++;});const tierMarket={1:4200,2:38000,3:900,4:6500,5:21000,6:52000};const rank={none:0,low:1,moderate:2,strong:3};const ps={none:"b-hot",low:"b-warm",moderate:"b-cold",strong:"b-cold"};const arr=Object.keys(byInd).map(k=>byInd[k]).map(o=>{const pen=o.past===0?"none":o.past===1?"low":o.past<=3?"moderate":"strong";const est=Math.round((tierMarket[o.tier]||1000)/12);let rec;if(pen==="none"&&o.open>0)rec=o.open+" open lead(s), no closed projects yet — launch a campaign.";else if(pen==="low")rec="Low penetration — strong category to expand.";else if(pen==="moderate")rec="Proven — scale outreach.";else rec="Strong presence — use as reference accounts.";return{o:o,pen:pen,est:est,rec:rec};}).sort((a,b)=>rank[a.pen]-rank[b.pen]||b.est-a.est);return '<h1>Market Expansion Finder</h1><p class="sub">Real penetration: where Orca Coast has WON ('+DATA.portfolio.length+' projects) vs. your open leads, by category. Surfaces under-penetrated verticals.</p><div class="tablewrap"><table><thead><tr><th>Category</th><th>Tier</th><th>Penetration</th><th>Past Projects</th><th>Open Leads</th><th>Recommendation</th></tr></thead><tbody>'+arr.map(x=>'<tr><td><b>'+esc(x.o.label)+'</b></td><td>Tier '+x.o.tier+'</td><td><span class="pill '+ps[x.pen]+'">'+x.pen+'</span></td><td>'+x.o.past+'</td><td>'+x.o.open+'</td><td class="tag">'+esc(x.rec)+'</td></tr>').join("")+'</tbody></table></div>';}

function view_heatmap(){if(STATE.leads.length===0)return '<h1>Opportunity Heat Map</h1><p class="sub">Provinces/states ranked by your leads\' revenue potential.</p>'+emptyLeads("Add leads to populate the heat map.");const by={};STATE.leads.forEach(l=>{const k=l.address.country+":"+l.address.region;const c=by[k]||{region:l.address.region,country:l.address.country,n:0,opp:0,pot:0,hot:0};const sc=scoreOf(l);c.n++;c.opp+=sc.opportunity;c.pot+=estVal(l.industry,l.signals).high;if(sc.opportunity>=80)c.hot++;by[k]=c;});const cells=Object.keys(by).map(k=>by[k]).map(c=>({...c,opp:Math.round(c.opp/c.n)})).sort((a,b)=>b.pot-a.pot);const max=Math.max.apply(null,cells.map(c=>c.pot).concat([1]));const CN={CA:"Canada",US:"United States"};return '<h1>Opportunity Heat Map</h1><p class="sub">Your leads by province/state, ranked by revenue potential.</p><div class="grid g3">'+cells.map(c=>'<div class="card" style="background:linear-gradient(135deg,rgba(55,181,74,'+(0.1+c.pot/max*0.4)+'),rgba(10,31,46,.6))"><div class="row"><b style="font-size:17px">'+esc(c.region)+'</b><span class="tag">'+CN[c.country]+'</span></div><div class="kv" style="border:0;padding-top:10px"><div><div class="lbl">Potential</div><div class="v">'+compact(c.pot)+'</div></div><div><div class="lbl">Leads</div><div class="v">'+c.n+'</div></div><div><div class="lbl">Avg Opp</div><div class="v">'+c.opp+'</div></div></div></div>').join("")+'</div>';}

function view_analytics(){const n=STATE.leads.length;const stages={};STATE.leads.forEach(l=>{stages[l.stage]=(stages[l.stage]||0)+1;});const order=["New Lead","Contacted","Responded","Discovery Call","Proposal Sent","Negotiation","Closed Won","Closed Lost"];const sent=Object.keys(STATE.enroll).reduce((a,id)=>a+STATE.enroll[id].steps.filter(s=>s.status==="sent").length,0);const pipe=STATE.leads.filter(l=>l.stage!=="New Lead"&&l.stage!=="Closed Lost"&&l.stage!=="Closed Won").reduce((a,l)=>{const sc=scoreOf(l);return a+Math.round((estVal(l.industry,l.signals).low+estVal(l.industry,l.signals).high)/2*closeProb(sc)/100);},0);const won=STATE.leads.filter(l=>l.stage==="Closed Won").reduce((a,l)=>a+Math.round((estVal(l.industry,l.signals).low+estVal(l.industry,l.signals).high)/2),0);const max=Math.max.apply(null,order.map(s=>stages[s]||0).concat([1]));return '<h1>Analytics</h1><p class="sub">Computed live from your '+n+' lead(s) and your real activity. Open/reply rates populate from real email events once sending is connected.</p><div class="grid g4" style="margin-bottom:18px">'+stat("Leads",n)+stat("Emails Sent",sent)+stat("In Sequence",Object.keys(STATE.enroll).length)+stat("Weighted Pipeline",money(pipe))+'</div><div class="card"><b>Pipeline by Stage</b><div style="margin-top:12px">'+order.map(s=>'<div style="display:flex;gap:12px;align-items:center;margin:6px 0"><div style="width:130px" class="muted">'+s+'</div><div style="flex:1;height:22px;background:#143a54;border-radius:6px;overflow:hidden"><div style="height:100%;background:var(--green);border-radius:6px;width:'+Math.max((stages[s]||0)/max*100,(stages[s]?8:0))+'%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-weight:600">'+(stages[s]||"")+'</div></div></div>').join("")+'</div></div>';}

function view_source(){
  setTimeout(()=>{const btn=document.getElementById("clsBtn");if(btn)btn.onclick=()=>{const txt=document.getElementById("clsIn").value;const def=(document.getElementById("clsRegion").value||"").toUpperCase();const lines=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const out=[];lines.forEach(line=>{const parts=splitLine(line).map(s=>s.trim());const name=parts[0];if(!name||/^name$/i.test(name))return;let reg=null;const fr=findRegion(line);if(parts[2]&&(CA.indexOf(parts[2].toUpperCase())>=0||US.indexOf(parts[2].toUpperCase())>=0))reg=parts[2].toUpperCase();else if(fr)reg=fr.region;else if(def)reg=def;const ind=classify(name,parts[2]);const meta=IM[ind]||{label:ind,tier:6};out.push({name:name,industry:meta.label,tier:meta.tier,region:reg});});out.sort((a,b)=>a.tier-b.tier);const tc=t=>t<=1?"var(--good)":t<=2?"var(--cold)":t<=4?"var(--warm)":"var(--muted)";document.getElementById("clsOut").innerHTML=out.length?('<div class="note" style="margin:8px 0">'+out.length+' classified (best-fit first):</div><div class="tablewrap"><table><thead><tr><th>Organization</th><th>Classified As</th><th>Tier</th><th>Region</th></tr></thead><tbody>'+out.map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td class="muted">'+esc(r.industry)+'</td><td style="color:'+tc(r.tier)+';font-weight:700">Tier '+r.tier+'</td><td class="muted">'+(r.region||'<span style="color:var(--warm)">set region</span>')+'</td></tr>').join("")+'</tbody></table></div>'):'<div class="note">Nothing parsed.</div>';};},0);
  return '<h1>Add / Source Leads</h1><p class="sub">Bring in your REAL leads. Paste a list (directory export, spreadsheet, or search results) and they\'re classified, scored, and added to your workspace. In the deployed app you can also live-source from OpenStreetMap/Google with no fabricated data.</p>'
    +importBox("")
    +'<div class="card" style="margin-top:16px"><b>Preview classifier (no add)</b><div class="note" style="margin:6px 0 10px">Test how organizations get tiered before adding.</div><textarea id="clsIn" rows="4" placeholder="Town of Oakville, Oakville, ON\nFirst Baptist Church, Dallas, TX">Town of Oakville, Oakville, ON\nFirst Baptist Church, Dallas, TX\nLittle Explorers Daycare, Calgary, AB</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:10px"><input id="clsRegion" type="text" placeholder="Default region" style="width:160px"><button class="btnG" id="clsBtn">Classify &amp; tier</button></div><div id="clsOut" style="margin-top:12px"></div></div>';
}

function view_portfolio(){const rows=DATA.portfolio;setTimeout(()=>{const inp=document.getElementById("psearch");if(inp)inp.oninput=()=>{const q=inp.value.toLowerCase();document.querySelectorAll("#ptable tbody tr").forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().indexOf(q)>=0?"":"none";});};},0);return '<h1>Real Orca Coast Portfolio</h1><p class="sub">'+rows.length+' real completed projects (CA + US) — the reference set powering lookalike matching. Names, locations, websites & install years are real; value bands are indicative (custom-scoped).</p><div style="margin-bottom:14px"><input id="psearch" type="search" placeholder="Filter by name, city, category…" style="width:300px"></div><div class="tablewrap"><table id="ptable"><thead><tr><th>Organization</th><th>Category</th><th>Location</th><th>Year</th><th>Value Band (ind.)</th><th>Vet</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+esc(shortName(p.name))+'</b></td><td class="muted">'+esc(p.label)+'</td><td class="muted">'+esc([p.city,p.region].filter(Boolean).join(", "))+' '+p.country+'</td><td class="muted">'+(p.year||"")+'</td><td class="muted">'+band(p.value)+'</td><td><a href="'+maps({name:shortName(p.name),city:p.city,region:p.region,country:p.country})+'" target="_blank">📍 Map</a>'+(p.website?(' · <a href="'+esc(nurl(p.website))+'" target="_blank">🔗</a>'):"")+'</td></tr>').join("")+'</tbody></table></div>';}

const VIEWS={leads:view_leads,source:view_source,who:view_who,pipeline:view_pipeline,campaigns:view_campaigns,market:view_market,heatmap:view_heatmap,analytics:view_analytics,portfolio:view_portfolio};
function show(id){document.getElementById("view").innerHTML=VIEWS[id]();document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));window.scrollTo(0,0);}
const nav=document.getElementById("nav");TABS.forEach(t=>{const b=document.createElement("button");b.textContent=t[1];b.dataset.id=t[0];b.onclick=()=>show(t[0]);nav.appendChild(b);});
show("leads");
</script>
</body>
</html>
